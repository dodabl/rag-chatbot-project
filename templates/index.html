<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>RAG chat</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css">
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <div class="app">
            <aside class="sidebar">
                <div class="sidebar-label">documents</div>
                <ul class="doc-list" id="doc-list">

                </ul>
                <div class="sidebar-spacer"></div>
                <button class="upload-btn" id="upload-btn">
                    <i class="ti ti-upload"></i> upload PDF
                </button>
                <input type="file" id="file-input" accept="application/pdf" style="display:none;">
                <div class="upload-status" id="upload-status"></div>
            </aside>
            <main class="main">
                <div class="title-bar">rag assistant</div>
                <div class="chat-scroll" id="chat-scroll">
                    <div class="empty-state" id="empty-state">
                        <i class="ti ti-messages"></i>
                        upload or select a document to get started
                    </div>
                </div>
                <div class="input-bar" id="input-bar">
                    <input type="text" id="question-input" placeholder="ask about your document..." disabled>
                    <button class="send-btn" id="send-btn" disabled aria-label="send">
                        <i class="ti ti-arrow-up"></i>
                    </button>
                </div>
            </main>
        </div>
        <script src="/static/chat.js"></script>
    </body>
</html>
